name: Update Board Manager Package Index (Enhanced)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to update (e.g., 1.0.7)'
        required: true

jobs:
  update-package-index:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Get version information
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Processing version: ${VERSION}"
      
      - name: Download and verify release archive
        id: archive_info
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${VERSION}.zip"
          
          echo "📥 Downloading: $URL"
          
          # Download with retry
          for i in {1..3}; do
            if curl -L --fail "$URL" -o release.zip; then
              echo "✅ Download successful"
              break
            else
              echo "⚠️ Download attempt $i failed"
              if [ $i -eq 3 ]; then
                echo "❌ Failed to download after 3 attempts"
                exit 1
              fi
              sleep 5
            fi
          done
          
          # Verify the file is a valid zip
          if ! unzip -t release.zip > /dev/null 2>&1; then
            echo "❌ Downloaded file is not a valid ZIP archive"
            exit 1
          fi
          
          # Calculate checksum and size
          CHECKSUM=$(sha256sum release.zip | awk '{print $1}')
          SIZE=$(stat -c%s release.zip)
          
          echo "checksum=SHA-256:${CHECKSUM}" >> $GITHUB_OUTPUT
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          
          echo "📊 Archive Information:"
          echo "  Checksum: SHA-256:${CHECKSUM}"
          echo "  Size: ${SIZE} bytes ($(numfmt --to=iec-i --suffix=B ${SIZE}))"
          
          rm release.zip
      
      - name: Validate JSON before update
        run: |
          if ! python3 -m json.tool board_manager/package_ch32_index.json > /dev/null; then
            echo "❌ Existing JSON file is invalid"
            exit 1
          fi
          echo "✅ Existing JSON is valid"
      
      - name: Update package_ch32_index.json
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import os
          from datetime import datetime
          
          def update_board_manager_json():
              # Environment variables
              version = os.environ['VERSION']
              checksum = os.environ['CHECKSUM']
              size = os.environ['SIZE']
              repo = os.environ['GITHUB_REPOSITORY']
              
              json_path = 'board_manager/package_ch32_index.json'
              
              print(f"🔄 Updating board manager JSON for version {version}")
              
              # Read existing JSON
              with open(json_path, 'r') as f:
                  data = json.load(f)
              
              # Create new platform entry
              new_platform = {
                  "name": "CH32 MCU Boards",
                  "architecture": "ch32v",
                  "version": version,
                  "category": "Contributed",
                  "url": f"https://github.com/{repo}/archive/refs/tags/{version}.zip",
                  "archiveFileName": f"CH32_Arduino_Core-{version}.zip",
                  "checksum": checksum,
                  "size": size,
                  "boards": [
                      {"name": "CH32X035 Board"},
                      {"name": "CH32V30x Board"},
                      {"name": "CH32V20x Board"},
                      {"name": "CH32V10x Board"},
                      {"name": "CH32V00x Board"}
                  ],
                  "toolsDependencies": [
                      {
                          "packager": "CH32_Arduino",
                          "name": "riscv-none-embed-gcc",
                          "version": "8.2.0"
                      },
                      {
                          "packager": "CH32_Arduino",
                          "name": "openocd",
                          "version": "1.0.0"
                      }
                  ]
              }
              
              # Get platforms array
              platforms = data['packages'][0]['platforms']
              
              # Check if version exists
              existing_index = None
              for i, platform in enumerate(platforms):
                  if platform['version'] == version:
                      existing_index = i
                      break
              
              if existing_index is not None:
                  # Update existing version
                  platforms[existing_index] = new_platform
                  print(f"✏️ Updated existing version {version} at index {existing_index}")
              else:
                  # Add new version at the beginning
                  platforms.insert(0, new_platform)
                  print(f"➕ Added new version {version}")
              
              # Sort platforms by version (newest first)
              def version_key(platform):
                  try:
                      parts = platform['version'].split('.')
                      return tuple(int(p) for p in parts)
                  except:
                      return (0, 0, 0)
              
              platforms.sort(key=version_key, reverse=True)
              
              # Write back with formatting
              with open(json_path, 'w') as f:
                  json.dump(data, f, indent=2)
                  f.write('\n')
              
              print(f"✅ Successfully updated {json_path}")
              print(f"📦 Total versions in index: {len(platforms)}")
              
              # Display recent versions
              print("\n📋 Recent versions:")
              for platform in platforms[:5]:
                  print(f"   - {platform['version']}")
              
              return True
          
          if __name__ == "__main__":
              try:
                  update_board_manager_json()
              except Exception as e:
                  print(f"❌ Error: {e}")
                  import traceback
                  traceback.print_exc()
                  exit(1)
          PYTHON_SCRIPT
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHECKSUM: ${{ steps.archive_info.checksum }}
          SIZE: ${{ steps.archive_info.size }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      
      - name: Validate updated JSON
        run: |
          if ! python3 -m json.tool board_manager/package_ch32_index.json > /dev/null; then
            echo "❌ Updated JSON file is invalid"
            exit 1
          fi
          echo "✅ Updated JSON is valid"
      
      - name: Show changes
        run: |
          echo "📝 Changes made:"
          git diff board_manager/package_ch32_index.json
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if git diff --quiet board_manager/package_ch32_index.json; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi
          
          git add board_manager/package_ch32_index.json
          git commit -m "🤖 Update board manager index for version ${{ steps.version.outputs.version }}

          - Version: ${{ steps.version.outputs.version }}
          - Checksum: ${{ steps.archive_info.checksum }}
          - Size: ${{ steps.archive_info.size }} bytes
          - Updated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          Auto-generated by GitHub Actions"
          
          git push
          
          echo "✅ Changes committed and pushed successfully"
      
      - name: Create summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 📦 Board Manager Update Summary
          
          **Version:** \`${{ steps.version.outputs.version }}\`
          
          **Archive Details:**
          - **URL:** https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.version.outputs.version }}.zip
          - **Checksum:** \`${{ steps.archive_info.checksum }}\`
          - **Size:** ${{ steps.archive_info.size }} bytes
          
          **Status:** ✅ Successfully updated board manager index
          
          **File Updated:** \`board_manager/package_ch32_index.json\`
          EOF
