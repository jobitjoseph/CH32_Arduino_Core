name: Update Board Manager (All Release Events)

on:
  release:
    types: [published, created, released, edited, prereleased]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to update (e.g., 1.0.6)'
        required: true
        type: string

jobs:
  update-package-index:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get version information
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            echo "Triggered by release event"
          else
            VERSION="${{ inputs.version }}"
            echo "Triggered manually"
          fi
          
          # Remove 'v' prefix if present
          VERSION="${VERSION#v}"
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Processing version: ${VERSION}"
      
      - name: Download and verify release archive
        id: archive_info
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${VERSION}.zip"
          
          echo "📥 Downloading: $URL"
          
          # Try with and without 'v' prefix
          if ! curl -L --fail "$URL" -o release.zip 2>/dev/null; then
            echo "Trying with 'v' prefix..."
            URL="https://github.com/${{ github.repository }}/archive/refs/tags/v${VERSION}.zip"
            curl -L --fail "$URL" -o release.zip
          fi
          
          echo "✅ Download successful"
          
          # Calculate checksum and size
          CHECKSUM=$(sha256sum release.zip | awk '{print $1}')
          SIZE=$(stat -c%s release.zip)
          
          echo "checksum=SHA-256:${CHECKSUM}" >> $GITHUB_OUTPUT
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          
          echo "📊 Archive Information:"
          echo "  Checksum: SHA-256:${CHECKSUM}"
          echo "  Size: ${SIZE} bytes"
          
          rm release.zip
      
      - name: Update package_ch32_index.json
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import os
          
          # Environment variables
          version = os.environ['VERSION']
          checksum = os.environ['CHECKSUM']
          size = os.environ['SIZE']
          repo = os.environ['GITHUB_REPOSITORY']
          
          json_path = 'board_manager/package_ch32_index.json'
          
          print(f"🔄 Updating board manager JSON for version {version}")
          
          # Read existing JSON
          with open(json_path, 'r') as f:
              data = json.load(f)
          
          # Create new platform entry
          new_platform = {
              "name": "CH32 MCU Boards",
              "architecture": "ch32v",
              "version": version,
              "category": "Contributed",
              "url": f"https://github.com/{repo}/archive/refs/tags/{version}.zip",
              "archiveFileName": f"CH32_Arduino_Core-{version}.zip",
              "checksum": checksum,
              "size": size,
              "boards": [
                  {"name": "CH32X035 Board"},
                  {"name": "CH32V30x Board"},
                  {"name": "CH32V20x Board"},
                  {"name": "CH32V10x Board"},
                  {"name": "CH32V00x Board"}
              ],
              "toolsDependencies": [
                  {
                      "packager": "CH32_Arduino",
                      "name": "riscv-none-embed-gcc",
                      "version": "8.2.0"
                  },
                  {
                      "packager": "CH32_Arduino",
                      "name": "openocd",
                      "version": "1.0.0"
                  }
              ]
          }
          
          # Get platforms array
          platforms = data['packages'][0]['platforms']
          
          # Check if version exists
          existing_index = None
          for i, platform in enumerate(platforms):
              if platform['version'] == version:
                  existing_index = i
                  break
          
          if existing_index is not None:
              platforms[existing_index] = new_platform
              print(f"✏️ Updated existing version {version}")
          else:
              platforms.insert(0, new_platform)
              print(f"➕ Added new version {version}")
          
          # Write back with formatting
          with open(json_path, 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          
          print(f"✅ Successfully updated {json_path}")
          
          PYTHON_SCRIPT
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHECKSUM: ${{ steps.archive_info.checksum }}
          SIZE: ${{ steps.archive_info.size }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if git diff --quiet board_manager/package_ch32_index.json; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi
          
          git add board_manager/package_ch32_index.json
          git commit -m "🤖 Update board manager index for version ${{ steps.version.outputs.version }}"
          git push
          
          echo "✅ Changes committed and pushed successfully"
